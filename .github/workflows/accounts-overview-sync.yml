name: Accounts Overview sync
# Full rebuild of the Accounts Overview tables (sdr_ao_*) from HubSpot. Isolated from the spine
# workflows: separate tables, separate state row, no advisory lock shared with the delta.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dataset_only:
        description: "Only rebuild the page's data file from the stored rows (1–2 min, no HubSpot pull)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: accounts-overview-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }  # 22+: supabase-js needs a global WebSocket (absent on Node 20)
      - run: npm ci
      - run: npm run ${{ inputs.dataset_only && 'ao:dataset' || 'ao:sync' }}
        env:
          HUBSPOT_PAT: ${{ secrets.HUBSPOT_PAT }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
